services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-mindstack}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports:
      - "${REDIS_PORT:-6379}:6379"

  chroma:
    image: ${CHROMA_IMAGE:-chromadb/chroma:latest}
    ports:
      - "${CHROMA_PORT:-8000}:8000"

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL:-all-minilm}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-tinyllama}"
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        set -e
        until ollama list >/dev/null 2>&1; do sleep 2; done
        EMBED_MODEL="$OLLAMA_EMBED_MODEL"
        GENERATION_MODEL="$OLLAMA_MODEL"
        if [ "$$EMBED_MODEL" = "all-minillm" ]; then EMBED_MODEL="all-minilm"; fi
        if [ "$$GENERATION_MODEL" = "all-minillm" ]; then GENERATION_MODEL="all-minilm"; fi
        ollama pull "$$EMBED_MODEL"
        if [ "$$GENERATION_MODEL" != "$$EMBED_MODEL" ]; then
          ollama pull "$$GENERATION_MODEL"
        fi
    restart: "no"

volumes:
  ollama_data:
